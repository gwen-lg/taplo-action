name: CI - Push check

on:
  push:
    branches-ignore:
      - "wip*"

jobs:
  check-conventional-commits:
    name: Check Conventional Commits
    runs-on: ubuntu-latest
    concurrency:
      # For a given workflow, if we push to the same branch, cancel all previous builds on that branch.
      # Particularly useful for workflow triggered on release-plz sync.
      # release-plz workflow update de pending pr twice (with cargo readme update)
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v6
      - uses: webiny/action-conventional-commits@v1.4.2

  list-commits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: test
        run: |
          echo $PWD
          tree -a .
      - uses: ./.github/list_commits
        id: list-commits
  #     - uses: your-org/commit-list-action@v1

  check-changelog-push:
    needs: list-commits
    strategy:
      matrix:
        commit: ${{ fromJSON(needs.list-commits.outputs.commits) }}

    name: "Check: ${{ matrix.commit.message }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: "${{ matrix.commit.id }}"

      - name: Generate Changelog
        id: generate-changelog
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
        env:
          OUTPUT: CHANGELOG_UP.md
          GITHUB_REPO: ${{ github.repository }}
      - name: Check Changelog
        id: check-changelog
        run: diff CHANGELOG.md CHANGELOG_UP.md
