name: CI - Test Action Across Platforms
on:
  push:
    branches-ignore:
      - "wip*"
  pull_request:

jobs:
  test-action:
    name: Test Taplo Action on Multiple Platforms
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Test Taplo Action
        uses: ./.
        with:
          format: true
          lint: false

      - name: Test Taplo Action with linting
        uses: ./.
        with:
          format: false
          lint: true

      - name: Test Taplo Action with both format
        uses: ./.
        with:
          format: true
          lint: true
          format_write_changes: false
