name: CI - Test Action Across Platforms
on:
  push:
    branches-ignore:
      - "wip*"
  pull_request:

jobs:
  test-action:
    name: Test Taplo Action on Multiple Platforms
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Test Taplo Action
        uses: ./.
        with:
          version: "0.10.0"
          format: "true"
          lint: "false"

      - name: Test Taplo Action with linting
        uses: ./.
        with:
          version: "0.10.0"
          format: "false"
          lint: "true"

      - name: Test Taplo Action with both format and lint
        uses: ./.
        with:
          version: "0.10.0"
          format: "true"
          lint: "true"
          format_write_changes: "false"
