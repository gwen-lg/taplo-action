name: Test list-commits-action

on: [pull_request, push]

jobs:
  list-commits-action:
    runs-on: ubuntu-latest
    steps:
      - uses: gwen-lg/list-commits-action@9062549a87423e269eeec2bfb20b1ad678a9bbf9
        id: list_commits

      - name: Print commits
        env:
          commits: ${{ steps.list_commits.outputs.commits }}
        run: |
          set -eu
          echo $commits
