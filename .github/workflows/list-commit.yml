name: Test list-commits-action

on: [pull_request, push]

jobs:
  list-commits-action:
    runs-on: ubuntu-latest
    steps:
      - uses: gwen-lg/list-commits-action@e2f23bd657417d5a1bda790e9086f40c0b61c882
        id: list_commits

      - name: Print commits
        env:
          commits: ${{ steps.list_commits.outputs.commits }}
        run: |
          set -eu
          echo $commits
