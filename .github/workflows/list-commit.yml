name: Test list-commits-action

on: [pull_request, push]

jobs:
  list-commits-action:
    runs-on: ubuntu-latest
    steps:
      - uses: gwen-lg/list-commits-action@ff9bdc86944756344166977c635a23036232603a
        id: list_commits

      - name: Print commits
        env:
          commits: ${{ steps.list_commits.outputs.commits }}
        run: |
          set -eu
          echo $commits
