name: Test list-commits-action

on: [pull_request, push]

jobs:
  list-commits-action:
    runs-on: ubuntu-latest
    steps:
      - uses: gwen-lg/list-commits-action@5dd23f92c4b23e375777990bc324f0f3e5158743
        id: list_commits

      - name: Print commits
        env:
          commits: ${{ steps.list_commits.outputs.commits }}
        run: |
          set -eu
          echo $commits
