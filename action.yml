name: "Taplo Action"
author: "Gwen Lg"
description: "Run check and/or lint on TOML files with Taplo."

inputs:
  version:
    description: "Version of Taplo"
    required: false
    default: "0.10.0"
  format:
    description: "Check formatting TOML files"
    required: false
    default: "true"
  format_write_changes:
    description: "Write the formatting changes to the repository"
    required: false
    default: "false"
  lint:
    description: "Check TOML files with lints"
    required: false
    default: "false"

runs:
  using: "composite"
  steps:
    - name: Install Taplo
      id: install
      shell: bash
      env:
        INSTALL_DIR: .
        INPUT_VERSION: ${{ inputs.version }}
      run:
        $GITHUB_ACTION_PATH/install.sh
        # sudo mv taplo /usr/local/bin/taplo

    - name: Format with Taplo
      if: ${{ inputs.format == 'true' }}
      id: format
      shell: bash
      env:
        INSTALL_DIR: .
      run: |
        if ! ${{ inputs.format_write_changes }}; then
            ARGS=" --check --diff"
        fi
        $GITHUB_ACTION_PATH/run.sh format ${ARGS}
    - name: Lint with Taplo
      if: ${{ inputs.lint == 'true' }}
      id: lint
      shell: bash
      env:
        INSTALL_DIR: .
      run: $GITHUB_ACTION_PATH/run.sh lint

branding:
  icon: "type"
  color: "red"
